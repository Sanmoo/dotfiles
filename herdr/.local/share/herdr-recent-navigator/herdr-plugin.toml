id = "beyondlex.herdr-recent-navigator"
name = "Herdr Recent Navigator"
version = "v0.6.9"
description = "Recent workspaces, tabs, panes, and AI agents switcher for Herdr."
min_herdr_version = "0.7.4"
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Open Navigator"
description = "Open the recent items navigator"
contexts = ["global", "workspace"]
command = ["/Users/samuel.santos/.local/share/herdr-recent-navigator/herdr-recent-navigator", "--pane-open"]

[[actions]]
id = "focus-workspaces"
title = "Quick Focus: Workspaces"
description = "Open navigator focused on Workspaces tab"
contexts = ["global", "workspace"]
command = ["/Users/samuel.santos/.local/share/herdr-recent-navigator/herdr-recent-navigator", "--pane-open", "--view", "workspaces"]

[[actions]]
id = "focus-tabs"
title = "Quick Focus: Tabs"
description = "Open navigator focused on Tabs tab"
contexts = ["global", "workspace"]
command = ["/Users/samuel.santos/.local/share/herdr-recent-navigator/herdr-recent-navigator", "--pane-open", "--view", "tabs"]

[[actions]]
id = "focus-agents"
title = "Quick Focus: Agents"
description = "Open navigator focused on Agents tab"
contexts = ["global", "workspace"]
command = ["/Users/samuel.santos/.local/share/herdr-recent-navigator/herdr-recent-navigator", "--pane-open", "--view", "agents"]

[[actions]]
id = "focus-panes"
title = "Quick Focus: Panes"
description = "Open navigator focused on Panes tab"
contexts = ["global", "workspace"]
command = ["/Users/samuel.santos/.local/share/herdr-recent-navigator/herdr-recent-navigator", "--pane-open", "--view", "panes"]

[[actions]]
id = "focus-previous-tab"
title = "Quick Focus: Previous Tab"
description = "Jump to the most recently focused tab without opening the navigator"
contexts = ["global", "workspace"]
command = ["/Users/samuel.santos/.local/share/herdr-recent-navigator/herdr-recent-navigator", "quick-focus-previous-tab"]

[[actions]]
id = "focus-previous-pane"
title = "Quick Focus: Previous Pane"
description = "Jump to the most recently focused pane without opening the navigator"
contexts = ["global", "workspace"]
command = ["/Users/samuel.santos/.local/share/herdr-recent-navigator/herdr-recent-navigator", "quick-focus-previous-pane"]

[[actions]]
id = "focus-previous-agent"
title = "Quick Focus: Previous Agent"
description = "Jump to the most recently used agent without opening the navigator"
contexts = ["global", "workspace"]
command = ["/Users/samuel.santos/.local/share/herdr-recent-navigator/herdr-recent-navigator", "quick-focus-previous-agent"]

[[events]]
on = "workspace.focused"
command = ["/Users/samuel.santos/.local/share/herdr-recent-navigator/herdr-recent-navigator", "track"]

[[events]]
on = "pane.focused"
command = ["/Users/samuel.santos/.local/share/herdr-recent-navigator/herdr-recent-navigator", "track"]

[[events]]
on = "tab.focused"
command = ["/Users/samuel.santos/.local/share/herdr-recent-navigator/herdr-recent-navigator", "track"]

[[panes]]
id = "navigator"
title = "Recent Navigator"
placement = "popup"
width = "60%"
command = ["/Users/samuel.santos/.local/share/herdr-recent-navigator/herdr-recent-navigator"]
